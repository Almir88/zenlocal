<div class="login-page">
  <div class="login-card">
    <header class="card-header">
      <h1>Login</h1>
      <p class="subtitle">Profile</p>
    </header>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
      <label class="field-label">Email</label>
      <input
        type="email"
        formControlName="email"
        placeholder="Enter email"
        autocomplete="email"
        class="input-field"
      />
      @if (form.get("email")?.invalid && form.get("email")?.touched) {
        <p class="field-error">Valid email is required</p>
      }
      <label class="field-label">Password</label>
      <div class="password-wrap">
        <input
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          placeholder="Enter password"
          autocomplete="current-password"
          class="input-field"
        />
        <button
          type="button"
          class="toggle-password"
          (click)="showPassword = !showPassword"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
        >
          @if (showPassword) {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
              />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          } @else {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      </div>
      @if (form.get("password")?.invalid && form.get("password")?.touched) {
        <p class="field-error">Password required (min. 6 characters)</p>
      }
      @if (error) {
        <p class="error">{{ error }}</p>
      }
      <button type="submit" class="submit-btn" [disabled]="form.invalid">
        Continue
      </button>
    </form>
  </div>
  <footer class="page-footer">
    <div class="footer-company">Zen Prompt GmbH</div>
    <div class="footer-legal">
      <a href="#">Imprint</a>
      <span class="sep">&</span>
      <a href="#">Privacy</a>
    </div>
  </footer>
</div>
