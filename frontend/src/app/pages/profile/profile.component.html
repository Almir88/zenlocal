<h2 class="section-title">My profile</h2>
<p class="section-desc">Update your name, email, or password.</p>

<div class="card profile-card">
  <h3 class="card-heading">Profile</h3>
  <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
    <div class="form-group">
      <label for="name">Name</label>
      <input id="name" type="text" formControlName="name" class="form-input" />
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        class="form-input"
      />
    </div>
    <button
      type="submit"
      class="btn btn-primary"
      [disabled]="profileForm.invalid || profileSaving"
    >
      {{ profileSaving ? "Saving…" : "Save profile" }}
    </button>
  </form>
</div>

<div class="card profile-card">
  <h3 class="card-heading">Change password</h3>
  <form [formGroup]="passwordForm" (ngSubmit)="changePassword()">
    <div class="form-group">
      <label for="currentPassword">Current password</label>
      <input
        id="currentPassword"
        type="password"
        formControlName="currentPassword"
        class="form-input"
      />
    </div>
    <div class="form-group">
      <label for="newPassword">New password</label>
      <input
        id="newPassword"
        type="password"
        formControlName="newPassword"
        class="form-input"
      />
    </div>
    <button
      type="submit"
      class="btn btn-primary"
      [disabled]="passwordForm.invalid || passwordSaving"
    >
      {{ passwordSaving ? "Saving…" : "Change password" }}
    </button>
  </form>
</div>
